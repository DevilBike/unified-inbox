<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<meta name="referrer" content="no-referrer">
<title>Unified Inbox</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7AA2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      <span class="brand-name">Unified Inbox</span>
    </div>
    <form class="search" id="searchForm" role="search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="searchInput" class="sr-only">Search all mailboxes</label>
      <input id="searchInput" type="search" placeholder="Search all mailboxes" autocomplete="off">
      <span class="kbd">/</span>
    </form>
    <span class="spacer"></span>
    <button class="btn small chip-warn" id="reconnectBtn" hidden></button>
    <button class="btn small" id="updateBtn" hidden style="border-color:#2c3c5e;color:#C9D8FF">Update</button>
  </header>
  <div class="body">
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="offline" id="offline" hidden role="alert">The app has stopped running. Start it again with <strong>Start Unified Inbox</strong> on your desktop, then reload this window.</div>
</div>
<dialog id="dialog"></dialog>
<div class="toast-host" id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
