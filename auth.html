<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in…</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0F1115; color: #E7E9EE; display: grid; place-items: center; min-height: 100vh; }
  p { font-size: 16px; color: #C9CDD6; }
</style>
</head>
<body>
<p id="msg">Signing in…</p>
<script>
  (function () {
    var params = {};
    var src = (location.hash.length > 1 ? location.hash.slice(1) : '') + '&' + location.search.slice(1);
    new URLSearchParams(src).forEach(function (v, k) { if (k) params[k] = v; });
    // Remove tokens from the address bar right away.
    history.replaceState(null, '', location.pathname);
    try { var ch = new BroadcastChannel('ui-oauth'); ch.postMessage({ type: 'result', params: params }); ch.close(); } catch (e) {}
    try { localStorage.setItem('ui-auth-result', JSON.stringify(params)); localStorage.removeItem('ui-auth-result'); } catch (e) {}
    var queue = [];
    try { queue = JSON.parse(localStorage.getItem('ui-auth-queue') || '[]'); } catch (e) {}
    if (queue.length) {
      var next = queue.shift();
      localStorage.setItem('ui-auth-queue', JSON.stringify(queue));
      document.getElementById('msg').textContent = 'Signing in to the next mailbox…';
      location.replace(next);
    } else {
      document.getElementById('msg').textContent = 'Done. You can close this window.';
      setTimeout(function () { window.close(); }, 300);
    }
  })();
</script>
</body>
</html>
